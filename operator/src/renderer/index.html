<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoLien Operator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #0b0d10;
        color: #e7e9ec;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p {
        color: #8b9099;
        font-size: 13px;
      }
      .card {
        background: #14181d;
        border: 1px solid #1f242b;
        border-radius: 12px;
        padding: 20px;
        margin-top: 16px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        font-size: 11px;
        border-radius: 999px;
        background: #2a2f37;
        color: #9aa0a8;
      }
    </style>
  </head>
  <body>
    <h1>AutoLien Operator</h1>
    <p>Phase 0 scaffold. UI lands in Phase 5.</p>

    <div class="card">
      <span class="badge">scaffold</span>
      <p style="margin-top: 12px">
        This window will host the carrier login status, active runs, and human-review queue.
      </p>
    </div>
  </body>
</html>
